<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaTiO - Report Guide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #2d3748;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.2em;
            color: #718096;
            font-weight: 400;
        }

        .content-wrapper {
            position: relative;
            width: 100%;
        }

        .image-container {
            position: relative;
            width: 100%;
            display: inline-block;
        }

        .report-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .hotspot {
            position: absolute;
            width: 32px;
            height: 32px;
            background: #667eea;
            border: 3px solid white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            z-index: 10;
        }

        .hotspot:hover {
            transform: scale(1.2);
            background: #764ba2;
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.6);
        }

        .hotspot.active {
            background: #f56565;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(245, 101, 101, 0.7);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(245, 101, 101, 0);
            }
        }

        .tooltip {
            position: absolute;
            background: #2d3748;
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            white-space: normal;
        }

        .tooltip.show {
            opacity: 1;
            pointer-events: auto;
        }

        .tooltip::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }

        .tooltip.top::before {
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0 8px;
            border-color: #2d3748 transparent transparent transparent;
        }

        .tooltip.bottom::before {
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 8px 8px 8px;
            border-color: transparent transparent #2d3748 transparent;
        }

        .tooltip.left::before {
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 8px 0 8px 8px;
            border-color: transparent transparent transparent #2d3748;
        }

        .tooltip.right::before {
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 8px 8px 8px 0;
            border-color: transparent #2d3748 transparent transparent;
        }

        .tooltip strong {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
            color: #667eea;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .header p {
                font-size: 1em;
            }

            .tooltip {
                max-width: 250px;
                font-size: 12px;
            }

            .hotspot {
                width: 28px;
                height: 28px;
                font-size: 12px;
            }
        }
    </style>
</head>
